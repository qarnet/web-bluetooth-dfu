<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="/manifest.json" />
  <title>BLE DFU</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    body.has-banner { padding-top: 4rem; justify-content: flex-start; }

    #compat-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: #7f1d1d;
      color: #fecaca;
      padding: 1rem 1.25rem;
      text-align: center;
      font-size: 0.9rem;
    }

    main { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 1.25rem; }

    h1 { font-size: 1.4rem; font-weight: 700; color: #60a5fa; }
    h1 span { font-size: 0.85rem; font-weight: 400; color: #64748b; display: block; margin-top: 0.2rem; }

    section {
      background: #1e2433;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    section h2 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 0.5rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3b82f6; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover:not(:disabled) { background: #475569; }
    .btn-danger    { background: #1e2433; color: #e2e8f0; }
    .btn-danger:hover:not(:disabled)    { background: #7f1d1d; }
    .btn-green     { background: #15803d; color: #fff; width: 100%; padding: 0.75rem; font-size: 0.9rem; }
    .btn-green:hover:not(:disabled) { background: #16a34a; }
    .update-row { display: flex; gap: 0.5rem; }
    .update-row .btn-green { flex: 1; }
    .btn-cancel { padding: 0.75rem; font-size: 0.85rem; }

    .file-label {
      display: inline-block;
      background: #334155;
      color: #e2e8f0;
      padding: 0.5rem 1.1rem;
      border-radius: 7px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .file-label:hover { background: #475569; }
    .file-label.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .file-row {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      border: 2px dashed transparent; border-radius: 8px; padding: 0.75rem; margin: -0.75rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .file-row.drag-active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }
    .file-name { font-size: 0.875rem; color: #4ade80; }



    .multi-image-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem;
    }
    .multi-image-row input[type=checkbox] { accent-color: #3b82f6; }
    .multi-image-row.disabled { opacity: 0.5; }
    .multi-image-info { font-size: 0.75rem; color: #64748b; }
    .firmware-info {
      display: flex; flex-direction: column; gap: 0.3rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: #161b27;
      border: 1px solid #334155;
      border-radius: 7px;
    }
    .fw-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; }
    .fw-info-label { color: #64748b; }
    .fw-info-value { color: #e2e8f0; font-family: monospace; }
    .reliable-mode-row {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem;
    }
    .reliable-mode-row input[type=checkbox] { accent-color: #3b82f6; }
    .reliable-mode-label { cursor: help; }

    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .protocol-badge {
      font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 4px;
      background: #1e3a5f; color: #93c5fd; font-weight: 600; display: none;
    }

    .slots { display: flex; flex-direction: column; gap: 0.4rem; }
    .btn-erase {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      background: #713f12;
      color: #fde68a;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-erase:hover:not(:disabled) { background: #92400e; }
    .slot {
      background: #0f1117;
      border-radius: 7px;
      padding: 0.5rem 0.75rem;
      font-family: monospace;
      font-size: 0.78rem;
    }
    .slot-top { display: flex; align-items: center; gap: 0.5rem; }
    .slot-label { color: #64748b; }
    .slot-version { color: #e2e8f0; }
    .slot-hash { color: #475569; margin-top: 0.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badges { display: flex; gap: 0.3rem; margin-left: auto; }
    .badge {
      font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; font-family: system-ui;
    }
    .badge-green  { background: #14532d; color: #86efac; }
    .badge-yellow { background: #713f12; color: #fde68a; }
    .badge-blue   { background: #1e3a5f; color: #93c5fd; }

    .progress-wrap { display: flex; flex-direction: column; gap: 0.3rem; }
    .progress-bar { height: 8px; background: #334155; border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: #22c55e; border-radius: 99px; transition: width 0.3s ease; }
    .progress-text { font-size: 0.75rem; color: #64748b; text-align: right; }

    .log-entries { display: flex; flex-direction: column; gap: 0.15rem; max-height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.78rem; }
    .log-info  { color: #64748b; }
    .log-ok    { color: #4ade80; }
    .log-warn  { color: #fbbf24; }
    .log-error { color: #f87171; }
    .log-action-btn {
      margin-left: 0.5rem;
      padding: 0.1rem 0.4rem;
      font-size: 0.72rem;
      font-family: system-ui;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .log-action-btn:hover:not(:disabled) { background: #475569; }
    .log-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #334155;
    }
    .log-ts    { color: #374151; margin-right: 0.4rem; }

    .filter-toggle { background: #334155; color: #94a3b8; font-size: 0.8rem; padding: 0.4rem 0.8rem; }
    .filter-toggle:hover { background: #475569; }

    .filter-panel {
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #161b27;
      border: 1px solid #334155;
      border-radius: 7px;
    }
    .filter-panel.filter-attention {
      animation: filterAttention 1s ease-in-out 2;
    }
    @keyframes filterAttention {
      0% { border-color: transparent; }
      50% { border-color: #f59e0b; }
      100% { border-color: transparent; }
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .filter-row input[type="text"] {
      flex: 1;
      background: #334155;
      border: none;
      border-radius: 5px;
      padding: 0.25rem 0.5rem;
      color: #e2e8f0;
      font: inherit;
      font-size: 0.8rem;
    }
    .filter-row input[type="checkbox"] {
      accent-color: #2563eb;
    }

    footer { font-size: 0.72rem; color: #374151; text-align: center; }
  </style>
</head>
<body>
  <div id="compat-banner">
    <strong>Web Bluetooth is not available.</strong>
    <span id="compat-msg"></span>
  </div>

  <main>
    <h1>BLE DFU <span>Firmware updater for nRF devices via Web Bluetooth</span></h1>

    <section id="sec-firmware">
      <h2>Firmware</h2>
      <div class="file-row">
        <label class="file-label" id="file-label">
          Choose file
          <input type="file" id="file-input" accept=".bin,.zip" style="display:none" />
        </label>
        <span class="file-name" id="file-name"></span>
        <span class="protocol-badge" id="protocol-badge"></span>
      </div>
      <div class="multi-image-row" id="multi-image-row" style="display:none">
        <label class="multi-image-label">
          <input type="checkbox" id="multi-image-check" />
          Multi-image update (SoftDevice + Application)
        </label>
        <span class="multi-image-info" id="multi-image-info"></span>
      </div>
      <div class="firmware-info" id="firmware-info" style="display:none">
        <div class="fw-info-row"><span class="fw-info-label">Planned update:</span> <span class="fw-info-value" id="fw-info-planned"></span></div>
        <div class="fw-info-row"><span class="fw-info-label">Currently running:</span> <span class="fw-info-value" id="fw-info-current"></span></div>
      </div>
      <div class="reliable-mode-row" id="reliable-mode-row" style="display:none">
        <label class="reliable-mode-label" title="Uses write-with-response for every packet. Slower (~2×) but catches silent write failures earlier. Useful on noisy RF links.">
          <input type="checkbox" id="reliable-mode-check" />
          Reliable mode (slower, safer)
        </label>
      </div>
    </section>

    <section id="sec-device">
      <h2>Device</h2>
      <div class="btn-row" id="btn-row-connect">
        <button class="btn-primary" id="btn-connect">Scan &amp; Connect</button>
        <button class="btn-secondary filter-toggle" id="filter-toggle" aria-expanded="false">Filters ▼</button>
      </div>
      <div class="btn-row" id="btn-row-connected" style="display:none">
        <button class="btn-secondary" id="btn-refresh">Refresh slots</button>
        <button class="btn-danger" id="btn-disconnect">Disconnect</button>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-reconnect" style="display:none">Reconnect</button>
      </div>
      <div class="filter-panel" id="filter-panel">
        <div class="filter-row">
          <input type="checkbox" id="scan-all" checked />
          <label for="scan-all">Scan all BLE devices</label>
        </div>
        <div class="filter-row">
          <label for="name-prefix">Name prefix</label>
          <input type="text" id="name-prefix" placeholder="e.g. Zephyr" />
        </div>
        <div class="filter-row">
          <label for="service-uuid">Service UUID</label>
          <input type="text" id="service-uuid" placeholder="e.g. 8d53dc1d-…" />
        </div>
      </div>
      <section id="sec-slots">
        <div class="slots" id="slots"></div>
        <button class="btn-secondary btn-erase" id="btn-erase-slot" style="display:none">Erase slot 1</button>
      </section>
    </section>

    <section id="sec-update">
      <h2>Update</h2>
      <div class="update-row">
        <button class="btn-green" id="btn-dfu" disabled>Update Firmware</button>
        <button class="btn-secondary btn-cancel" id="btn-cancel" disabled>Cancel</button>
      </div>
      <button class="btn-green" id="btn-confirm" style="display:none" disabled>Confirm Update</button>
      <div class="progress-wrap" id="progress-wrap" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-text" id="progress-text"></div>
      </div>
    </section>

    <section id="sec-log" style="display:none">
      <h2>Log</h2>
      <div class="log-entries" id="log-entries"></div>
      <div class="log-actions">
        <button class="btn-secondary" id="btn-copy-log">Copy logs</button>
        <button class="btn-secondary" id="btn-download-log">Download</button>
      </div>
    </section>

    <footer>Chrome / Edge desktop + Android only · HTTPS required · Supports SMP/MCUboot and Nordic Secure DFU</footer>
  </main>

  <script type="module" src="app.js"></script>
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(console.error);
      }

      const banner = document.getElementById('compat-banner');
      const msg = document.getElementById('compat-msg');
      if (!navigator.bluetooth) {
        banner.style.display = 'block';
        document.body.classList.add('has-banner');
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isHTTP = window.location.protocol !== 'https:';
        if (isIOS) {
          msg.textContent = ' iOS/iPadOS does not support Web Bluetooth in any browser. Use Android or desktop Chrome.';
        } else if (isHTTP) {
          msg.innerHTML = ' This page is served over HTTP. Web Bluetooth requires HTTPS or localhost. <a href="' + window.location.href.replace('http:', 'https:') + '" style="color:#fecaca; text-decoration:underline;">Reload over HTTPS</a>.';
        } else if (navigator.userAgent.includes('Linux')) {
          msg.innerHTML = ' On Linux Chrome, enable <code>chrome://flags/#enable-web-bluetooth-new-permissions-backend</code>, set it to <strong>Enabled</strong>, and relaunch Chrome.';
        } else {
          msg.textContent = ' Use Chrome on Android, Windows, macOS, or Linux.';
        }
      }
    })();
  </script>
</body>
</html>
